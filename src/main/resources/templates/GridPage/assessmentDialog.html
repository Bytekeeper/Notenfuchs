<dialog id="assessment-dialog" class="assessment-dialog" data-base-url="/subjects/{subject.id}/grid/assessments" data-points-key="{keySpec}" data-points-key-sliding="{keySliding}">
    <form method="post" class="assessment-dialog-form">
        <h2 class="assessment-dialog-title">Leistung</h2>
        <p class="hint assessment-dialog-category"></p>
        <input type="hidden" name="categoryId">
        <input type="hidden" name="returnTo" value="{returnTo ?: ''}">
        <div class="form-field">
            <label for="assessmentName">Name</label>
            <input type="text" id="assessmentName" name="name" placeholder="z. B. Klassenarbeit 1" required>
        </div>
        <div class="form-field">
            <label for="assessmentDate">Datum</label>
            <input type="date" id="assessmentDate" name="date">
        </div>
        <div class="form-field">
            <label for="assessmentFactor">Faktor</label>
            <input type="number" id="assessmentFactor" name="factor" step="0.01" min="0.01" value="1.0" required>
        </div>
        <div class="form-field checkbox-field">
            <label><input type="checkbox" id="assessmentPointsBased" name="pointsBased" value="true"> Punktebasiert (mit Notenschlüssel)</label>
        </div>
        <p class="hint assessment-dialog-points-warning" hidden>Beim Wechsel zwischen Punkten und Noten werden die bisherigen Einträge dieser Leistung gelöscht.</p>
        <div class="assessment-dialog-bands" hidden>
            <div class="form-field">
                <label for="assessmentMaxPoints">Höchstpunktzahl</label>
                <input type="number" id="assessmentMaxPoints" name="maxPoints" step="0.5" min="0.5" required>
            </div>
            <h3>Notenschlüssel</h3>
            <table class="bands-editor">
                <thead><tr><th>Note</th><th>Punkte</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
            <div class="form-field checkbox-field">
                <label><input type="checkbox" id="assessmentPointsSliding" name="pointsSliding" value="true"> Gleitend (die Note steigt zwischen zwei Zeilen gleichmäßig)</label>
            </div>
            <p class="hint">Darunter: {worstGrade}. Prozentwerte des Fachs: „Leistungen &amp; Gewichtung“.</p>
            <div class="bands-actions">
                <button type="button" class="secondary assessment-dialog-add-band">+ Zeile</button>
                <button type="button" class="secondary assessment-dialog-apply-key">Schlüssel des Fachs anwenden</button>
            </div>
            <p class="private hint assessment-dialog-preview" aria-live="polite"></p>
        </div>
        <template class="band-row-template">
            <tr>
                <td><input type="text" name="bandGrades" required aria-label="Note"></td>
                <td><input type="number" name="bandPoints" step="0.5" min="0" required aria-label="Punkte"></td>
                <td><button type="button" class="delete-btn band-remove" aria-label="Zeile entfernen">×</button></td>
            </tr>
        </template>
        <p class="hint warning assessment-dialog-error" role="alert" hidden></p>
        <div class="assessment-dialog-actions">
            <button type="submit">Speichern</button>
            <button type="button" class="secondary assessment-dialog-cancel">Abbrechen</button>
            <button type="submit" class="delete-btn assessment-dialog-delete" formnovalidate>Leistung löschen</button>
        </div>
    </form>
</dialog>
