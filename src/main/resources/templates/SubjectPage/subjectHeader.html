<div class="breadcrumbs"><a href="/classes">Übersicht</a> / <a href="/classes/{subject.schoolClass.id}">{subject.schoolClass.name}</a> / {subject.name}</div>
<div class="subject-heading">
    <h1>{subject.schoolClass.name} – {subject.name} <small class="heading-meta">({subject.schoolClass.schoolYear})</small></h1>
    {#if switchSubjects.size > 1}
    <label class="subject-switcher">
        <span>Fach wechseln</span>
        <select data-tab-path="{#if activeTab == 'grid'}/grid{#else if activeTab == 'distribution'}/distribution{#else if activeTab == 'teachers'}/teachers{/if}">
            {#for s in switchSubjects}
                <option value="{s.id}" {#if s.id == subject.id}selected{/if}>{s.schoolClass.name} – {s.name}</option>
            {/for}
        </select>
    </label>
    {/if}
</div>
<nav class="tabs">
    <a href="/subjects/{subject.id}/grid" {#if activeTab == 'grid'}class="active" aria-current="page"{/if}>Notenerfassung</a>
    <a href="/subjects/{subject.id}/distribution" {#if activeTab == 'distribution'}class="active" aria-current="page"{/if}>Notenspiegel</a>
    <a href="/subjects/{subject.id}" {#if activeTab == 'setup'}class="active" aria-current="page"{/if}>Leistungen &amp; Gewichtung</a>
    <a href="/subjects/{subject.id}/teachers" {#if activeTab == 'teachers'}class="active" aria-current="page"{/if}>Lehrkräfte</a>
    <a class="tabs-aside" href="/classes/{subject.schoolClass.id}/behavior-grid">Verhaltensnoten der Klasse →</a>
</nav>
