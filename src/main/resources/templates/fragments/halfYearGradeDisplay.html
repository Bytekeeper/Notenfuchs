<form id="half-year-grade-display-fragment" class="inline-form half-year-grade-display-form" hx-patch="/classes/{schoolClass.id}/half-year-grade-display" hx-target="this" hx-swap="outerHTML">
    <div class="form-field">
        <label for="halfYearGradeDisplay">Halbjahresnote</label>
        <select id="halfYearGradeDisplay" name="halfYearGradeDisplay">
            <option value="WHOLE" {#if schoolClass.halfYearGradeDisplay.name == 'WHOLE'}selected{/if}>Ganze Noten</option>
            <option value="HALF" {#if schoolClass.halfYearGradeDisplay.name == 'HALF'}selected{/if}>Halbe Noten</option>
        </select>
    </div>
    <div class="form-field">
        <label for="tendencyThreshold">Tendenz (±)</label>
        <input type="number" id="tendencyThreshold" name="tendencyThreshold" min="0" max="0.49" step="0.01" placeholder="keine"
               value="{#if schoolClass.halfYearTendencyThreshold}{schoolClass.halfYearTendencyThreshold.plain}{/if}">
    </div>
    <button type="submit">Speichern</button>
    {#if saved??}<span class="saved-note" role="status">Gespeichert</span>{/if}
    <p class="tendency-example hint"></p>
</form>
