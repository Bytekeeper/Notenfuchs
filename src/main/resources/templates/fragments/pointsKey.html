<form id="points-key-form" class="card points-key" data-points-key="{keySpec}" data-points-key-sliding="{keySliding}" hx-post="/subjects/{subject.id}/points-key" hx-target="this" hx-swap="outerHTML">
    <table class="bands-editor">
        <thead><tr><th>Note</th><th>ab % der Höchstpunktzahl</th><th></th></tr></thead>
        <tbody class="key-rows">
            {#for row in keyRows}
            <tr>
                <td><input type="text" name="grade" value="{row.grade}" required aria-label="Note"></td>
                <td><input type="number" name="percent" step="0.1" min="0" max="100" value="{row.percent.plain}" required aria-label="Prozent"></td>
                <td><button type="button" class="delete-btn band-remove" aria-label="Zeile entfernen">×</button></td>
            </tr>
            {/for}
        </tbody>
    </table>
    <template class="key-row-template">
        <tr>
            <td><input type="text" name="grade" required aria-label="Note"></td>
            <td><input type="number" name="percent" step="0.1" min="0" max="100" required aria-label="Prozent"></td>
            <td><button type="button" class="delete-btn band-remove" aria-label="Zeile entfernen">×</button></td>
        </tr>
    </template>
    <div class="form-field checkbox-field">
        <label><input type="checkbox" name="sliding" value="true"{#if keySliding} checked{/if}> Gleitend: die Note steigt zwischen zwei Zeilen gleichmäßig (sonst gilt sie ab ihrer Zeile)</label>
    </div>
    <p class="hint">Weniger Punkte als in der letzten Zeile: {worstGrade}, gleitend erst nach und nach.</p>
    <div class="bands-actions">
        <button type="button" class="secondary key-add-row">+ Zeile</button>
        <button type="submit">Speichern</button>
        {#if saved??}<span class="saved-note" role="status">Gespeichert</span>{/if}
    </div>
</form>
