<form id="half-year-cutoff-fragment" class="inline-form" hx-patch="/classes/{schoolClass.id}/half-year-cutoff" hx-target="this" hx-swap="outerHTML">
    <div class="form-field">
        <label for="halfYearCutoff">Stichtag</label>
        <input type="date" id="halfYearCutoff" name="halfYearCutoff" value="{schoolClass.halfYearCutoff ?: ''}">

    <button type="submit">Speichern</button>
    {#if saved??}<span class="saved-note" role="status">Gespeichert</span>{/if}
</form>
