{#include base}
{#title}Übersicht – Notenfuchs{/title}

<h1>Übersicht</h1>

{#include fragments/home /}

<details class="add-panel"{#if yearGroups.isEmpty} open{/if}>
<summary>+ Klasse anlegen</summary>
<div class="card">
    <form class="inline-form" hx-post="/classes" hx-target="#home-fragment" hx-swap="outerHTML">
        <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="z. B. 8b" required>
        </div>
        <div class="form-field">
            <label for="schoolYear">Schuljahr</label>
            <input type="text" id="schoolYear" name="schoolYear" placeholder="z. B. 2025/26" required>
        </div>
        <button type="submit">Anlegen</button>
    </form>
</div>
</details>

{/include}
